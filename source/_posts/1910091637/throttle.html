<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>节流测试</title>
</head>

<body>
	<div>
		<button id="btn1">节流按钮</button>
		<button id="btn2">无节流按钮</button>
	</div>
	<script type="text/javascript">
		// 节流: 高频事件触发，但在n秒内只会执行一次，所以节流会稀释函数的执行频率
		const btn1 = document.getElementById('btn1');
		const btn2 = document.getElementById('btn2');

		function sayHi() {
			console.log('节流测试');
		}

		function throttle(fn) {
			let disable = true;
			return function () {
				if (!disable) return;
				disable = false;
				setTimeout(() => {
					fn.apply(this, arguments);
					disable = true;
				}, 500);
			}
		}

		btn1.onclick = throttle(sayHi);
		btn2.onclick = sayHi

	</script>
</body>

</html>
