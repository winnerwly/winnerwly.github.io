<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Dwan — 文章详情</title>
    
    <!-- 引入炫酷的科幻风格和极客字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@400;600&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Highlight.js 的暗黑极客主题 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    
    <!-- 引入 Marked.js 解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入 Highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-color: #030305;
            --surface-color: rgba(15, 15, 20, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --neon-primary: #00ffcc;
            --neon-secondary: #bc13fe;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            
            --font-display: 'Orbitron', sans-serif;
            --font-mono: 'Fira Code', monospace;
            --font-sans: 'Noto Sans SC', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.8;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部导航 */
        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(3, 3, 5, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-primary);
            text-decoration: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            margin-left: 2rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--neon-primary);
            text-shadow: 0 0 8px var(--neon-primary);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0;
            width: 0; height: 2px;
            background: var(--neon-primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* 主容器 */
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 8rem 5% 4rem;
            min-height: 100vh;
        }

        /* Markdown 文章样式 */
        .markdown-body {
            font-family: var(--font-sans);
            color: var(--text-main);
            word-wrap: break-word;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-weight: 700;
            line-height: 1.25;
            color: #fff;
        }

        .markdown-body h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            border-bottom: 2px solid var(--neon-secondary);
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 5px rgba(188, 19, 254, 0.5);
        }

        .markdown-body h2 {
            font-size: 1.75rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .markdown-body p {
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .markdown-body a {
            color: var(--neon-primary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .markdown-body a:hover {
            text-decoration: underline;
            text-shadow: 0 0 5px var(--neon-primary);
        }

        .markdown-body code {
            font-family: var(--font-mono);
            background-color: rgba(255, 255, 255, 0.1);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
            color: var(--neon-primary);
        }

        .markdown-body pre {
            background-color: #0d1117; /* Atom One Dark 风格背景 */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            overflow: auto;
            margin-bottom: 1.5rem;
        }

        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
            color: inherit;
            font-size: 0.9em;
        }

        .markdown-body blockquote {
            padding: 0 1em;
            color: var(--text-muted);
            border-left: 0.25em solid var(--neon-secondary);
            margin: 0 0 1rem 0;
            background: rgba(188, 19, 254, 0.05);
        }

        .markdown-body ul, .markdown-body ol {
            padding-left: 2em;
            margin-bottom: 1rem;
        }

        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .meta-info {
            display: flex;
            gap: 1rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .meta-info span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .loading {
            text-align: center;
            font-family: var(--font-mono);
            color: var(--neon-primary);
            font-size: 1.2rem;
            margin-top: 4rem;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        /* 底部 */
        footer {
            text-align: center;
            padding: 3rem 1.5rem;
            border-top: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.5);
            margin-top: 4rem;
        }

        .footer-heart {
            color: #ff3366;
            display: inline-block;
        }

        .back-btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            border: 1px solid var(--neon-primary);
            color: var(--neon-primary);
            font-family: var(--font-mono);
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">WINNERWLY</a>
        <div class="nav-links">
            <a href="index.html#blog">返回列表</a>
        </div>
    </nav>

    <main>
        <div id="loading" class="loading">Loading Data [..........]</div>
        <div id="content" class="markdown-body" style="display: none;"></div>
        <a href="index.html#blog" class="back-btn" style="display: none;" id="backBtn">← Return</a>
    </main>

    <footer>
        <p>由 Rey Dwan 用 <span class="footer-heart">♥</span> 构建</p>
        <p style="margin-top: 0.5rem; font-size: 0.8rem; opacity: 0.5;">© 2026 winnerwly.github.io - 所有系统运行正常。</p>
    </footer>

    <script>
        // 配置 Marked.js，使用 highlight.js 进行代码高亮
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-',
            gfm: true,
            breaks: true
        });

        // 获取 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        const contentDiv = document.getElementById('content');
        const loadingDiv = document.getElementById('loading');
        const backBtn = document.getElementById('backBtn');

        if (!fileName) {
            loadingDiv.textContent = 'Error: No file specified. [404]';
        } else {
            // 加载 Markdown 文件
            fetch(`posts/${fileName}.md`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(text => {
                    // 简单的 FrontMatter (YAML) 解析
                    let title = "无标题文章";
                    let date = "未知日期";
                    let tags = "";
                    let markdownContent = text;

                    // 匹配 --- 包裹的 FrontMatter
                    const frontMatterRegex = /^---\n([\s\S]*?)\n---\n/;
                    const match = text.match(frontMatterRegex);

                    if (match) {
                        const frontMatter = match[1];
                        markdownContent = text.replace(frontMatterRegex, '');

                        // 提取 title 和 date
                        const titleMatch = frontMatter.match(/title:\s*['"]?(.*?)['"]?$/m);
                        if (titleMatch) title = titleMatch[1];

                        const dateMatch = frontMatter.match(/date:\s*(.*)$/m);
                        if (dateMatch) date = dateMatch[1];
                        
                        const tagsMatch = frontMatter.match(/tags:\s*\[(.*?)\]/m);
                        if (tagsMatch) tags = tagsMatch[1];
                    }

                    // 构建带元数据的 HTML
                    let html = `<h1>${title}</h1>`;
                    html += `
                        <div class="meta-info">
                            <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${date}</span>
                            ${tags ? `<span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg> ${tags}</span>` : ''}
                        </div>
                    `;
                    
                    // 将 Markdown 转换为 HTML 并拼接
                    html += marked.parse(markdownContent);

                    contentDiv.innerHTML = html;
                    document.title = `${title} — Rey Dwan`;
                    
                    loadingDiv.style.display = 'none';
                    contentDiv.style.display = 'block';
                    backBtn.style.display = 'inline-block';
                })
                .catch(error => {
                    console.error('Error fetching markdown:', error);
                    loadingDiv.textContent = 'Error: Failed to load article data. [500]';
                });
        }
    </script>
</body>
</html>
