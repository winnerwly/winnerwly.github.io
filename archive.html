<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Dwan — 所有文章</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@400;600&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #030305;
            --surface-color: rgba(15, 15, 20, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --neon-primary: #00ffcc;
            --neon-secondary: #bc13fe;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            
            --font-display: 'Orbitron', sans-serif;
            --font-mono: 'Fira Code', monospace;
            --font-sans: 'Noto Sans SC', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部导航 */
        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(3, 3, 5, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-primary);
            text-decoration: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            margin-left: 2rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--neon-primary);
            text-shadow: 0 0 8px var(--neon-primary);
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 8rem 5% 4rem;
            min-height: 100vh;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 2rem;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px; left: 50%;
            transform: translateX(-50%);
            width: 50px; height: 3px;
            background: var(--neon-secondary);
            box-shadow: 0 0 10px var(--neon-secondary);
        }

        /* 搜索框 */
        .search-container {
            margin-bottom: 3rem;
            text-align: center;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--neon-primary);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        /* 列表容器 */
        .archive-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .archive-item {
            background-color: rgba(20, 20, 25, 0.5);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .archive-item:hover {
            border-color: rgba(0, 255, 204, 0.3);
            transform: translateX(10px);
            background-color: rgba(20, 20, 25, 0.8);
        }

        .archive-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 4px; height: 100%;
            background: var(--neon-primary);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .archive-item:hover::before {
            opacity: 1;
        }

        .item-info {
            flex-grow: 1;
        }

        .item-title {
            font-family: var(--font-sans);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .item-meta {
            display: flex;
            gap: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-muted);
            align-items: center;
        }

        .item-tags {
            display: flex;
            gap: 0.5rem;
        }

        .item-tags span {
            color: var(--neon-secondary);
        }

        .item-date {
            color: var(--neon-primary);
            font-family: var(--font-mono);
            font-size: 1rem;
            min-width: 120px;
            text-align: right;
        }

        /* 底部 */
        footer {
            text-align: center;
            padding: 3rem 1.5rem;
            border-top: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.5);
            margin-top: 4rem;
        }

        .footer-heart {
            color: #ff3366;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .archive-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .item-date {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">WINNERWLY</a>
        <div class="nav-links">
            <a href="index.html#blog">返回首页</a>
        </div>
    </nav>

    <main>
        <h1 class="section-title">所有文章 / Archive</h1>
        
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="搜索文章标题或标签...">
        </div>

        <div class="archive-list" id="archiveList">
            <!-- 动态加载列表 -->
            <div style="text-align:center; color:var(--neon-primary); font-family:var(--font-mono);">Loading...</div>
        </div>
    </main>

    <footer>
        <p>由 Rey Dwan 用 <span class="footer-heart">♥</span> 构建</p>
        <p style="margin-top: 0.5rem; font-size: 0.8rem; opacity: 0.5;">© 2026 winnerwly.github.io - 所有系统运行正常。</p>
    </footer>

    <script>
        let allPosts = [];

        async function loadPosts() {
            try {
                const res = await fetch('posts.json');
                allPosts = await res.json();
                renderPosts(allPosts);
            } catch(e) {
                console.error("加载文章失败: ", e);
                document.getElementById('archiveList').innerHTML = '<div style="text-align:center; color:red;">加载失败，请检查网络或 posts.json 是否存在。</div>';
            }
        }

        function renderPosts(posts) {
            const list = document.getElementById('archiveList');
            if (posts.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--text-muted);">未找到匹配的文章。</div>';
                return;
            }

            list.innerHTML = posts.map(post => `
                <a href="article.html?file=${post.id}" class="archive-item">
                    <div class="item-info">
                        <div class="item-title">${post.title}</div>
                        <div class="item-meta">
                            <div class="item-tags">
                                ${post.tags.map(tag => `<span>#${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="item-date">${post.date}</div>
                </a>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allPosts.filter(post => 
                post.title.toLowerCase().includes(keyword) || 
                post.tags.some(tag => tag.toLowerCase().includes(keyword))
            );
            renderPosts(filtered);
        });

        loadPosts();
    </script>
</body>
</html>
